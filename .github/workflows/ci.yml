name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7
      - run: nix develop --command pnpm install --frozen-lockfile
      - run: nix develop --command pnpm typecheck
      - run: nix develop --command pnpm lint
      - run: nix develop --command pnpm test
      - run: nix develop --command pnpm test:e2e
